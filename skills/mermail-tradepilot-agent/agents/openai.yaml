interface:
  display_name: "Mermail Trade Pilot Agent"
  short_description: "Monitor trading alerts, validate prices, execute trades via Agent Wallet"
  default_prompt: "Use $mermail-tradepilot-agent to monitor your Mermail inbox for trading signals and auto-execute trades when conditions are met."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and Agent Wallet MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"